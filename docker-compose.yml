version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: cyberneura-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: cyberneura-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberneura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberneura_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cyberneura_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cyberneura}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberneura-backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://cyberneura:cyberneura_secret@postgres:5432/cyberneura_db
      - AI_SERVICE_URL=http://ai-service:8000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberneura-frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cyberneura-ai
    ports:
      - '8000:8000'
    volumes:
      - ./ai-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:
  postgres_data:
